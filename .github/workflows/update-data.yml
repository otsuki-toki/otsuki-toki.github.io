# ライブ予定（TimeTree）とnoteの最新記事を、6時間ごとに自動で取り直して data/ を更新する。
# このフォルダ（work/pixel-intro）を、公開用のGitHubリポジトリの一番上に置いたときに動く。
# 変わったときだけコミットされ、GitHub Pages が自動で作り直して公開する。
name: update-data
on:
  schedule:
    - cron: "0 */6 * * *"      # 6時間ごと（UTC）
  workflow_dispatch:            # 手動でも実行できる
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 外部の部品は、中身が勝手に変わらないよう版を固定する（v4 のコミット）
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # Python は ubuntu-latest に最初から入っているので、追加の部品は使わない
      - name: ライブ予定を取得
        run: python3 update_live.py
        continue-on-error: true     # 片方が失敗しても、もう片方は更新する
      - name: noteの最新記事を取得
        run: python3 update_notes.py
        continue-on-error: true
      - name: 変わっていればコミット
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name  "site-bot"
            git config user.email "site-bot@users.noreply.github.com"
            git add data/
            git commit -m "ライブ予定・note記事を自動更新"
            git push
          else
            echo "変更なし"
          fi
